name: Publish Carrot.Memory

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test Carrot.Memory.UnitTest/Carrot.Memory.UnitTest.csproj --configuration Release --no-build

      - name: Pack
        run: |
          VERSION=${{ github.event.release.tag_name }}
          VERSION=${VERSION#v}
          dotnet pack Carrot.Memory/Carrot.Memory.csproj --configuration Release --output nupkg -p:PackageVersion=$VERSION

      - name: NuGet Login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: carrot

      - name: Push
        run: dotnet nuget push nupkg/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate